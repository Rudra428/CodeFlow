
services:
  - type: web
    name: codeflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120 app:app
    envVars:
      - key: ENABLE_LOCAL_EXECUTION
        value: "false"
      - key: FRONTEND_ORIGINS
        sync: false
