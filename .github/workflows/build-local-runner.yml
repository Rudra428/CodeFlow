name: Build Windows Local Runner

on:
  push:
    tags:
      - "local-runner-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out CodeFlow
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: .\backend\build_installer.ps1

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            .\backend\build\release\CodeFlowLocalRunner-Setup.exe `
            --title "CodeFlow Local Runner $env:GITHUB_REF_NAME" `
            --notes "Per-user Windows installer for the opt-in CodeFlow local judge. Review the installer and local-execution security notes before running."

      - name: Upload installer artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: CodeFlowLocalRunner-Setup
          path: backend/build/release/CodeFlowLocalRunner-Setup.exe
          if-no-files-found: error
